<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Open in AI Agent</title>
<style>
  /* The settings page's fonts and tokens (options.html): near-white paper, ink, hairlines, and the icon's red
     for focus rings and the hover line only. */
  @font-face { font-family: 'Libre Franklin'; font-weight: 400; font-style: normal; font-display: block;
               src: url(fonts/libre-franklin-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Libre Franklin'; font-weight: 600; font-style: normal; font-display: block;
               src: url(fonts/libre-franklin-latin-600-normal.woff2) format('woff2'); }
  :root { --paper: #fafaf8; --ink: #15171a; --ink-2: #555a61; --rule: #dcdfe3; --rubric: #fb3e36;
          --key-bg: #ffffff; --key-line: #c4c8ce; --icon-ring: transparent;
          --sans: 'Libre Franklin', -apple-system, 'Segoe UI', Roboto, sans-serif;
          --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #121315; --ink: #e8e9eb; --ink-2: #9aa0a8; --rule: #2c2f34;
            --key-bg: #1d1f23; --key-line: #3d4148; --icon-ring: #3d4148; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--paper); }
  body { margin: 0; width: 320px; max-width: 100%; background: var(--paper); color: var(--ink); font: 400 14.5px/1.5 var(--sans);
         font-kerning: normal; -webkit-font-smoothing: antialiased; }
  .sheet { padding: 14px 16px 12px; }
  .mast { display: flex; align-items: center; gap: 9px; margin: 0 0 12px; font: 600 14px/1.3 var(--sans); }
  .mast img { width: 20px; height: 20px; flex: none; border-radius: 4px; box-shadow: 0 0 0 1px var(--icon-ring); }
  .context { margin: 0 0 8px; font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }
  /* Outside Gmail: the settings page's notice, a ruled band with the hint in ink. */
  .context.hint { margin-bottom: 12px; padding: 9px 0 10px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule);
                  font-size: 14px; color: var(--ink); }
  ul { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--rule); }
  .ai { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; min-height: 44px;
        padding: 11px 2px 12px 0; text-align: left; font: 600 15px/1.3 var(--sans); color: var(--ink); cursor: pointer;
        background: none; border: 0; border-top: 1px solid var(--rule); border-radius: 0; }
  .ai .note { flex: none; font: 400 12.5px/1.3 var(--sans); color: var(--ink-2); }
  .ai:hover:not(:disabled) .label { text-decoration: underline; text-decoration-color: var(--rubric); text-decoration-thickness: 2px;
                                    text-underline-offset: 0.22em; }
  .ai:disabled { color: var(--ink-2); cursor: default; }
  .ai[aria-disabled="true"] { cursor: progress; }
  .empty { margin: 0; padding: 9px 0 10px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); font-weight: 600; }
  footer { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 14px; margin-top: 12px;
           font-size: 13.5px; color: var(--ink-2); }
  a { color: var(--ink); text-decoration-color: var(--rubric); text-decoration-thickness: 1px; text-underline-offset: 0.22em; }
  a:hover { text-decoration-thickness: 2px; }
  kbd { display: inline-block; min-width: 1.6em; padding: 0.1em 0.38em 0.12em; margin: 0 0.04em; text-align: center;
        font: 600 0.82em/1.25 var(--sans); vertical-align: 0.06em; color: var(--ink); background: var(--key-bg);
        border: 1px solid var(--key-line); border-bottom-width: 2px; border-radius: 4px; }
  .ai:focus-visible, a:focus-visible { outline: 3px solid var(--rubric); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="sheet">
  <header class="mast"><img src="icons/icon48.png" alt=""><span>Open in AI Agent</span></header>
  <!-- popup.js fills these from TARGETS and from what the Gmail tab in front has open or ticked. -->
  <p class="context" id="context"></p>
  <p class="empty" id="empty" hidden>Nothing picked yet. Pick your AIs in Settings.</p>
  <ul id="list" aria-labelledby="context"></ul>
  <footer>
    <a href="options.html" id="settings">Settings</a>
    <span id="last" hidden></span>
  </footer>
</div>
<script src="targets.js"></script>
<script src="popup.js"></script>
</body>
</html>
