<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; min-width: 420px; color: #202124; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
  p { color: #5f6368; margin: 6px 0 12px; }
  button { padding: 6px 14px; font: inherit; }
  #status { margin-left: 8px; color: #188038; }
</style>
</head>
<body>
  <label for="folder">Working folder for new sessions</label>
  <input id="folder" type="text" placeholder="/Users/you/Documents/Work" spellcheck="false">
  <p>Full path to the folder Claude Code and Codex should open in. Recommended. If left blank, Claude Code uses its default folder
     and Codex may wait for you to pick a project instead of starting. On a Mac, drag the folder into Terminal to copy its path.</p>
  <button id="save">Save</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
